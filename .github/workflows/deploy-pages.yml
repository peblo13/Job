name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - fix/inteligentna-wyszukiwarka-cv

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install (optional)
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Build (optional)
        run: |
          # If you have a build step, replace the echo with your build command, e.g. npm run build
          echo "No build step configured"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
